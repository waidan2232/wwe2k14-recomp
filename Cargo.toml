[workspace]
resolver = "3"
members = ["runtime/audio", "runtime/gpu", "runtime/kernel", "runtime/host", "runtime/ppc-rt", "runtime/render", "tools/analyse", "tools/disc", "tools/kat", "tools/pac", "tools/ppc", "tools/recomp", "tools/stfs", "tools/xenos-shader-recomp", "tools/xex"]
# Recompiler output is its own workspace (generated/rust).
exclude = ["generated"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false

[workspace.dependencies]
disc = { path = "tools/disc" }
ppc = { path = "tools/ppc" }
xex = { path = "tools/xex" }
aes = "0.8.4"
# Host engine, pinned in Phase 0. The host crate first uses it in Phase 3, so it isn't compiled yet.
bevy = "=0.20.1"

[profile.release]
debug = "line-tables-only"
