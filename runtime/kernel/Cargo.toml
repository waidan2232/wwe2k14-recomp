[package]
name = "kernel"
description = "Native implementation of the Xbox 360 kernel and XAM API contracts for the recompiled game"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
ppc-rt = { path = "../ppc-rt" }
xex = { workspace = true }
rayon = "1.12"
# Custom soundtracks (the music player, `music.rs`): the common audio formats.
symphonia = { version = "0.5.5", default-features = false, features = ["mp3", "flac", "aac", "isomp4", "alac", "vorbis", "ogg", "pcm", "wav", "adpcm", "aiff", "mkv"] }
